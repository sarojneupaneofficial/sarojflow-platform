version: "3.9"

networks:
  sarojflow-net:
    driver: bridge

volumes:
  postgres-data:
  delta-lake-data:
  airflow-logs:

services:

  # ─── Kafka Stack ───────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: sarojflow-zookeeper
    networks: [sarojflow-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: sarojflow-kafka
    networks: [sarojflow-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sarojflow-kafka-ui
    networks: [sarojflow-net]
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sarojflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: sarojflow-schema-registry
    networks: [sarojflow-net]
    depends_on: [kafka]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ─── Topic Initialiser ─────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sarojflow-kafka-init
    networks: [sarojflow-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic.raw.events       --replication-factor 1 --partitions 12
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic.clean.events     --replication-factor 1 --partitions 6
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic.anomalies        --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic.alerts           --replication-factor 1 --partitions 3
      echo 'Kafka topics created.'
      "

  # ─── Postgres (metadata + analytics) ──────────────────────────────────────
  postgres:
    build: ./postgres
    container_name: sarojflow-postgres
    networks: [sarojflow-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sarojflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarojflow123}
      POSTGRES_DB: ${POSTGRES_DB:-sarojflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarojflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Traffic Producer ──────────────────────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: sarojflow-producer
    networks: [sarojflow-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: traffic.raw.events
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10}
      NUM_CAMERAS: ${NUM_CAMERAS:-12}
    restart: on-failure

  # ─── Spark Structured Streaming ────────────────────────────────────────────
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: sarojflow-spark
    networks: [sarojflow-net]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/sarojflow
      POSTGRES_USER: ${POSTGRES_USER:-sarojflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarojflow123}
      DELTA_LAKE_PATH: /data/delta
    volumes:
      - delta-lake-data:/data/delta
    restart: on-failure

  # ─── FastAPI Gateway ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sarojflow-api
    networks: [sarojflow-net]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://sarojflow:sarojflow123@postgres:5432/sarojflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
    restart: on-failure

  # ─── Airflow ────────────────────────────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: sarojflow-airflow-web
    networks: [sarojflow-net]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sarojflow:sarojflow123@postgres:5432/sarojflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - delta-lake-data:/data/delta
    command: webserver
    restart: on-failure

  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: sarojflow-airflow-scheduler
    networks: [sarojflow-net]
    depends_on: [airflow-webserver]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sarojflow:sarojflow123@postgres:5432/sarojflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - delta-lake-data:/data/delta
    command: scheduler
    restart: on-failure

  # ─── Dashboard ─────────────────────────────────────────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: sarojflow-dashboard
    networks: [sarojflow-net]
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped
